name: Patch Everyday English final pass

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'curate/everyday-english-final-pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add verified Basement Yard 256 greeting clip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/everyday-english-clips.ts')
          s = p.read_text()

          collection = '''const basementYard256: CuratedCollection = {\n  id: 'english-basement-yard-256-introductions',\n  speakerId: 'joe-santagato-frank-alvarez',\n  speaker: 'Joe Santagato / Frank Alvarez',\n  sourceTitle: 'The Basement Yard #256 · The Worst Job Interview Of All Time',\n  videoId: 'Ae_Y8g4Syeo',\n  videoTitle: 'The Worst Job Interview Of All Time | The Basement Yard #256',\n  channelName: 'The Basement Yard',\n  thumbnail: 'https://i.ytimg.com/vi/Ae_Y8g4Syeo/hqdefault.jpg',\n  duration: 3900,\n  description: "Queens/NYC conversational English with a clean, reciprocal first-meeting greeting: 'Nice to meet you.'",\n  focus: ['Everyday English', 'NYC', 'Introductions', 'Natural conversation'],\n  status: 'ready',\n  segments: [\n    segment('TBY256-GREET-07', 274.0, 281.5, "First meeting · 'Nice to meet you. Nice to meet you.'"),\n  ],\n}\n\n'''
          anchor = 'const basementYard339: CuratedCollection = {'
          if 'const basementYard256:' not in s:
              if anchor not in s:
                  raise SystemExit('collection insertion anchor not found')
              s = s.replace(anchor, collection + anchor, 1)

          array_anchor = 'export const EVERYDAY_ENGLISH_COLLECTIONS: CuratedCollection[] = [\n'
          if '  basementYard256,\n' not in s:
              if array_anchor not in s:
                  raise SystemExit('collection array anchor not found')
              s = s.replace(array_anchor, array_anchor + '  basementYard256,\n', 1)

          match = '''  {\n    phraseId: 'greet-07',\n    collectionId: basementYard256.id,\n    segmentId: 'TBY256-GREET-07',\n    speaker: 'Joe Santagato / Frank Alvarez exchange',\n    transcript: 'Nice to meet you. Nice to meet you.',\n    matchType: 'exact',\n    evidenceUrl: 'https://podscripts.co/podcasts/the-basement-yard/256-the-worst-job-interview-of-all-time',\n  },\n'''
          matches_anchor = 'export const EVERYDAY_ENGLISH_CLIP_MATCHES: EverydayEnglishClipMatch[] = [\n'
          if "phraseId: 'greet-07'" not in s:
              if matches_anchor not in s:
                  raise SystemExit('match insertion anchor not found')
              s = s.replace(matches_anchor, matches_anchor + match, 1)

          p.write_text(s)

          p = Path('docs/EVERYDAY_ENGLISH_CURATION_STATUS.md')
          s = p.read_text()
          s = s.replace(
              '- `greet-07` Nice to meet you. — candidate found in The Basement Yard #256 around 00:04:36; YouTube video ID still needs independent verification before promotion',
              '- `greet-07` Nice to meet you. — exact reciprocal first-meeting greeting in The Basement Yard #256, YouTube `Ae_Y8g4Syeo`, 4:34–4:41.5',
          )
          evidence_anchor = '- #567 opening transcript/speaker context: Audioscrape `https://www.audioscrape.com/podcast/the-basement-yard/episode/567-making-out-in-public-59420`; official YouTube source independently verified as `https://www.youtube.com/watch?v=pDbCTTEuDi0`\n'
          extra = '- #256 timestamped transcript: Podscripts `https://podscripts.co/podcasts/the-basement-yard/256-the-worst-job-interview-of-all-time`; official YouTube source independently verified as `https://www.youtube.com/watch?v=Ae_Y8g4Syeo`\n'
          if extra not in s:
              if evidence_anchor not in s:
                  raise SystemExit('status evidence anchor not found')
              s = s.replace(evidence_anchor, evidence_anchor + extra, 1)
          s = s.replace('- Verified phrase matches: 25', '- Verified phrase matches: 26')
          s = s.replace('- Unique playable source clips: 21', '- Unique playable source clips: 22')
          s = s.replace('The Basement Yard #339, #351, #444, #446, #477, #480, #483, #494, #498, #507, #558, #559, #565, #567', 'The Basement Yard #256, #339, #351, #444, #446, #477, #480, #483, #494, #498, #507, #558, #559, #565, #567')
          p.write_text(s)
          PY
          git config user.name 'Kavi'
          git config user.email 'thisizkavi@gmail.com'
          git add lib/everyday-english-clips.ts docs/EVERYDAY_ENGLISH_CURATION_STATUS.md
          git commit -m 'Add verified nice-to-meet-you clip'
          git push origin HEAD:${{ github.head_ref }}
