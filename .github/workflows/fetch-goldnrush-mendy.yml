name: Fetch GOLDNRUSH Mendy transcript

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transcribe-mendy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download official podcast audio
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 -fLsS 'https://traffic.megaphone.fm/ICIHN3067059746.mp3' -o mendy.mp3
          ls -lh mendy.mp3

      - name: Transcribe Japanese with faster-whisper
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade faster-whisper
          python - <<'PY'
          import json
          from faster_whisper import WhisperModel

          # Small gives much better Japanese than tiny/base while still being practical on a CPU runner.
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe(
              'mendy.mp3',
              language='ja',
              beam_size=5,
              vad_filter=True,
              word_timestamps=True,
              condition_on_previous_text=True,
          )
          out=[]
          words=[]
          for s in segments:
              row={'start':round(s.start,3),'end':round(s.end,3),'text':s.text.strip()}
              if row['text']:
                  out.append(row)
              for w in (s.words or []):
                  if w.start is None or w.end is None: continue
                  words.append({'start':round(w.start,3),'end':round(w.end,3),'word':w.word})
          payload={
              'videoId':'aQ3rPDWuKrI',
              'audioSource':'GOLDNRUSH official RSS enclosure',
              'audioUrl':'https://traffic.megaphone.fm/ICIHN3067059746.mp3',
              'language':getattr(info,'language','ja'),
              'languageProbability':getattr(info,'language_probability',None),
              'model':'faster-whisper-small',
              'segments':out,
              'words':words,
          }
          with open('mendy-whisper.json','w',encoding='utf-8') as f:
              json.dump(payload,f,ensure_ascii=False,indent=2)
          with open('mendy-whisper.txt','w',encoding='utf-8') as f:
              for x in out:
                  f.write(f"[{x['start']:.3f} --> {x['end']:.3f}] {x['text']}\n")
          print('language',payload['language'],'probability',payload['languageProbability'])
          print('segments',len(out),'words',len(words),'last_end',out[-1]['end'] if out else None)
          if len(out) < 150 or not out or out[-1]['end'] < 3000:
              raise SystemExit('Transcript coverage is unexpectedly incomplete')
          PY

      - name: Upload Whisper transcript
        uses: actions/upload-artifact@v4
        with:
          name: goldnrush-mendy-whisper-ja
          path: |
            mendy-whisper.json
            mendy-whisper.txt
          retention-days: 1
