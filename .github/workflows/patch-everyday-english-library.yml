name: Patch Everyday English into Library

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'refactor/everyday-english-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move Everyday English into Library navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Remove the standalone English item from the main nav.
          p = Path('app/page.tsx')
          s = p.read_text()
          standalone = '''          <Button variant="ghost" size="sm" asChild>\n            <a href="/english" className="text-xs">English</a>\n          </Button>\n'''
          if standalone not in s:
              raise SystemExit('English nav block not found')
          s = s.replace(standalone, '', 1)
          p.write_text(s)

          # Add Everyday English as a built-in collection inside Library.
          p = Path('app/library/page.tsx')
          s = p.read_text()
          s = s.replace(
              "import { ArrowLeft, Plus, FolderPlus, MoreVertical, Trash2, Edit, Video, Loader2 } from 'lucide-react'",
              "import { ArrowLeft, Plus, FolderPlus, MoreVertical, Trash2, Edit, Video, Loader2, BookOpen, ArrowRight } from 'lucide-react'",
              1,
          )
          anchor = "import type { Library, LibraryGroup } from '@/lib/types'\n"
          extra_import = "import { EVERYDAY_ENGLISH_CHAPTERS, EVERYDAY_ENGLISH_PHRASE_COUNT } from '@/lib/everyday-english'\n"
          if extra_import not in s:
              s = s.replace(anchor, anchor + extra_import, 1)

          main_anchor = '            <main className="container mx-auto px-4 py-6">\n'
          built_in = '''                <section className="mb-8">\n                    <div className="mb-3">\n                        <h2 className="text-sm font-semibold tracking-tight">Built-in learning</h2>\n                        <p className="text-xs text-muted-foreground mt-0.5">Structured collections that live alongside your own practice groups.</p>\n                    </div>\n                    <Card\n                        className="cursor-pointer hover:border-primary/50 transition-colors group max-w-xl"\n                        onClick={() => router.push('/english')}\n                    >\n                        <CardHeader className="pb-2">\n                            <div className="flex items-start justify-between gap-4">\n                                <div className="flex items-center gap-3">\n                                    <div className="h-11 w-11 rounded-lg bg-primary/10 flex items-center justify-center shrink-0">\n                                        <BookOpen className="h-5 w-5 text-primary" />\n                                    </div>\n                                    <div>\n                                        <CardTitle className="text-lg">Everyday English</CardTitle>\n                                        <p className="text-xs text-muted-foreground mt-1">\n                                            {EVERYDAY_ENGLISH_CHAPTERS.length} chapters • {EVERYDAY_ENGLISH_PHRASE_COUNT} American speaking targets\n                                        </p>\n                                    </div>\n                                </div>\n                                <ArrowRight className="h-4 w-4 text-muted-foreground mt-1 transition-transform group-hover:translate-x-1" />\n                            </div>\n                        </CardHeader>\n                        <CardContent>\n                            <p className="text-sm text-muted-foreground leading-relaxed">\n                                Conversation-first American English organized by chapter, with a contemporary NYC / Northeast General American target accent.\n                            </p>\n                        </CardContent>\n                    </Card>\n                </section>\n\n'''
          if built_in not in s:
              if main_anchor not in s:
                  raise SystemExit('Library main anchor not found')
              s = s.replace(main_anchor, main_anchor + built_in, 1)
          p.write_text(s)
          PY
          git config user.name 'Kavi'
          git config user.email 'thisizkavi@gmail.com'
          git add app/page.tsx app/library/page.tsx
          git commit -m 'Place Everyday English inside Library'
          git push origin HEAD:${{ github.head_ref }}
