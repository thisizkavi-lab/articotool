name: Run7 patch helper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run7-patch-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curate/everyday-english-run7
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch verified agreement clips
        shell: bash
        run: |
          python - <<'PY'
          import base64
          payload = ''
          open('/tmp/patch.py','wb').write(base64.b64decode(payload))
          PY
          python /tmp/patch.py
          git config user.name 'Kavi'
          git config user.email 'thisizkavi@gmail.com'
          git add lib/everyday-english-clips.ts docs/EVERYDAY_ENGLISH_CURATION_STATUS.md
          git commit -m 'Add verified agreement phrase clips'
          git push origin HEAD:curate/everyday-english-run7
