name: Resolve GOLDNRUSH YouTube IDs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search public Piped instances
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request

          instances=[
            'https://pipedapi.kavin.rocks',
            'https://pipedapi.tokhmi.xyz',
            'https://pipedapi.syncpundit.io',
            'https://api-piped.mha.fi',
            'https://piped-api.garudalinux.org',
          ]
          queries={
            'zeebra-149':'GOLDNRUSH PODCAST Ep.149 Zeebra',
            'shigekix-106':'GOLDNRUSH PODCAST Ep.106 Shigekix',
          }
          out={}
          for slug,q in queries.items():
              matches=[]
              for base in instances:
                  url=base+'/search?'+urllib.parse.urlencode({'q':q,'filter':'videos'})
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                      data=json.loads(urllib.request.urlopen(req,timeout=15).read().decode())
                  except Exception as e:
                      print(slug,base,'failed',repr(e)); continue
                  items=data.get('items',data if isinstance(data,list) else [])
                  for item in items[:20]:
                      title=item.get('title','')
                      url_path=item.get('url','')
                      uploader=item.get('uploaderName','')
                      if 'GOLDNRUSH' not in title.upper() and 'GOLDNRUSH' not in uploader.upper():
                          continue
                      if slug.startswith('zeebra') and 'zeebra' not in title.lower():
                          continue
                      if slug.startswith('shigekix') and 'shigekix' not in title.lower():
                          continue
                      vid=url_path.rsplit('=',1)[-1] if 'watch?v=' in url_path else url_path.strip('/').split('/')[-1]
                      if len(vid)==11:
                          row={'videoId':vid,'title':title,'uploader':uploader,'source':base,'url':url_path}
                          if row not in matches:
                              matches.append(row)
                  if matches: break
              out[slug]=matches
              print(slug,json.dumps(matches,ensure_ascii=False))
          pathlib.Path('resolved-video-ids.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          if not out['zeebra-149'] or not out['shigekix-106']:
              raise SystemExit('Did not resolve both target video IDs')
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldnrush-video-ids
          path: resolved-video-ids.json
          if-no-files-found: warn
          retention-days: 1
