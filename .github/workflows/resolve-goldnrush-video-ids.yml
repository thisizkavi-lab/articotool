name: Resolve GOLDNRUSH YouTube IDs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve IDs from YouTube search metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade yt-dlp
          python - <<'PY'
          import json, pathlib, re, subprocess, urllib.parse, urllib.request

          queries={
            'zeebra-149':'GOLDNRUSH PODCAST Ep.149 Zeebra',
            'shigekix-106':'GOLDNRUSH PODCAST Ep.106 Shigekix',
          }
          out={}
          for slug,q in queries.items():
              matches=[]
              # First try YouTube's search HTML. It often exposes videoId/title in ytInitialData
              # even when playback endpoints reject cloud IPs.
              try:
                  u='https://www.youtube.com/results?'+urllib.parse.urlencode({'search_query':q})
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja,en;q=0.8'})
                  text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
                  for m in re.finditer(r'"videoId":"([A-Za-z0-9_-]{11})".{0,700}?"title":\{"runs":\[\{"text":"(.*?)"\}',text,re.S):
                      vid,title=m.groups()
                      title=bytes(title,'utf-8').decode('unicode_escape','ignore') if '\\u' in title else title
                      if slug.startswith('zeebra') and 'zeebra' not in title.lower(): continue
                      if slug.startswith('shigekix') and 'shigekix' not in title.lower(): continue
                      row={'videoId':vid,'title':title,'source':'youtube-search-html'}
                      if row not in matches: matches.append(row)
              except Exception as e:
                  print(slug,'html search failed',repr(e))

              # Then try flat yt-dlp search; this does not download the video.
              if not matches:
                  try:
                      cp=subprocess.run(['yt-dlp','--flat-playlist','--dump-json',f'ytsearch15:{q}'],text=True,capture_output=True,timeout=90)
                      print(slug,'yt-dlp rc',cp.returncode,'stderr',cp.stderr[-1000:])
                      for line in cp.stdout.splitlines():
                          try: item=json.loads(line)
                          except: continue
                          title=item.get('title') or ''
                          vid=item.get('id') or ''
                          if slug.startswith('zeebra') and 'zeebra' not in title.lower(): continue
                          if slug.startswith('shigekix') and 'shigekix' not in title.lower(): continue
                          if len(vid)==11:
                              row={'videoId':vid,'title':title,'source':'yt-dlp-search'}
                              if row not in matches: matches.append(row)
                  except Exception as e:
                      print(slug,'yt-dlp failed',repr(e))

              out[slug]=matches
              print(slug,json.dumps(matches,ensure_ascii=False))
          pathlib.Path('resolved-video-ids.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          if not out['zeebra-149'] or not out['shigekix-106']:
              raise SystemExit('Did not resolve both target video IDs')
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldnrush-video-ids
          path: resolved-video-ids.json
          if-no-files-found: warn
          retention-days: 1
