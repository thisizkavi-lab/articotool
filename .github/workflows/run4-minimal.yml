name: Everyday English run4 patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/curate/everyday-english-run4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curate/everyday-english-run4
      - run: python .github/run4_patch.py
      - run: |
          git config user.name Kavi
          git config user.email thisizkavi@gmail.com
          git add lib/everyday-english-clips.ts docs/EVERYDAY_ENGLISH_CURATION_STATUS.md
          git diff --cached --quiet || git commit -m 'Add verified opinion agreement and gratitude clips'
          git push origin HEAD:curate/everyday-english-run4
