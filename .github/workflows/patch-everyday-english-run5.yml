name: Patch Everyday English run 5

on:
  push:
    branches: [curate/everyday-english-09-13]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curate/everyday-english-09-13
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add verified apology goodbye and weather clips
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/everyday-english-clips.ts')
          s = p.read_text()
          anchor = "export const EVERYDAY_ENGLISH_COLLECTIONS: CuratedCollection[] = [\n"
          additions = r'''const basementYard480: CuratedCollection = {
  id: 'english-basement-yard-480-weather',
  speakerId: 'joe-santagato-frank-alvarez',
  speaker: 'Joe Santagato / Frank Alvarez',
  sourceTitle: 'The Basement Yard #480 · A.I Is Officially Coming For Us!',
  videoId: 'NFqQCoEdGA0',
  videoTitle: 'A.I Is Officially Coming For Us! | The Basement Yard #480',
  channelName: 'The Basement Yard',
  thumbnail: 'https://i.ytimg.com/vi/NFqQCoEdGA0/hqdefault.jpg',
  duration: 0,
  description: "Queens/NYC conversational English with a clean opening weather comment: 'it's freezing out.'",
  focus: ['Everyday English', 'NYC', 'Weather', 'Natural conversation'],
  status: 'ready',
  segments: [
    segment('TBY480-WEATHER-02', 0.0, 10.0, "Weather · 'It's freezing out.'"),
  ],
}

const basementYard565: CuratedCollection = {
  id: 'english-basement-yard-565-apology-goodbye',
  speakerId: 'joe-santagato-frank-alvarez',
  speaker: 'Joe Santagato / Frank Alvarez',
  sourceTitle: 'The Basement Yard #565 · Are We Ready For Pie?!',
  videoId: 'WGN6kLtVYBk',
  videoTitle: 'Are We Ready For Pie?! | The Basement Yard #565',
  channelName: 'The Basement Yard',
  thumbnail: 'https://i.ytimg.com/vi/WGN6kLtVYBk/hqdefault.jpg',
  duration: 0,
  description: "Recent Queens/NYC conversation with a compact 'my bad' correction and a clean 'see you' outro.",
  focus: ['Everyday English', 'NYC', 'Apologies', 'Goodbyes'],
  status: 'ready',
  segments: [
    segment('TBY565-SORRY-02', 4765.0, 4775.0, "Casual apology · 'Oh, my bad.'"),
    segment('TBY565-BYE-02', 4788.0, 4797.0, "Casual goodbye · 'See you guys next time.'"),
  ],
}

'''
          if additions not in s:
              if anchor not in s:
                  raise SystemExit('collections anchor not found')
              s = s.replace(anchor, additions + anchor, 1)
          if '  basementYard480,\n' not in s:
              s = s.replace("  basementYard477,\n", "  basementYard477,\n  basementYard480,\n", 1)
          if '  basementYard565,\n' not in s:
              s = s.replace("  basementYard559,\n  basementYard567,\n", "  basementYard559,\n  basementYard565,\n  basementYard567,\n", 1)

          match_anchor = "  {\n    phraseId: 'suggest-06',\n"
          new_matches = r'''  {
    phraseId: 'sorry-02',
    collectionId: basementYard565.id,
    segmentId: 'TBY565-SORRY-02',
    speaker: 'Frank Alvarez',
    transcript: 'Oh, my bad.',
    matchType: 'exact',
    evidenceUrl: 'https://pod.wave.co/podcast/the-basement-yard/565-are-we-ready-for-pie',
  },
  {
    phraseId: 'bye-02',
    collectionId: basementYard565.id,
    segmentId: 'TBY565-BYE-02',
    speaker: 'Joe Santagato',
    transcript: 'See you guys next time.',
    matchType: 'lexical-variant',
    evidenceUrl: 'https://pod.wave.co/podcast/the-basement-yard/565-are-we-ready-for-pie',
  },
  {
    phraseId: 'weather-02',
    collectionId: basementYard480.id,
    segmentId: 'TBY480-WEATHER-02',
    speaker: 'Joe Santagato / Frank Alvarez exchange',
    transcript: "Keep it warm. It's freezing out. The weather is starting to turn.",
    matchType: 'lexical-variant',
    evidenceUrl: 'https://www.audioscrape.com/podcast/the-basement-yard/episode/480---ai-is-officially-coming-for-us',
  },
'''
          if new_matches not in s:
              if match_anchor not in s:
                  raise SystemExit('match anchor not found')
              s = s.replace(match_anchor, new_matches + match_anchor, 1)
          p.write_text(s)

          p = Path('docs/EVERYDAY_ENGLISH_CURATION_STATUS.md')
          s = p.read_text()
          old = "### 09–13\nNot yet promoted in the source-controlled clip corpus. Existing phrase targets remain in `lib/everyday-english.ts`.\n"
          new = """### 09 Saying sorry
- `sorry-02` My bad. — exact match `Oh, my bad.` from Frank Alvarez in The Basement Yard #565, YouTube `WGN6kLtVYBk`, 79:25–79:35.
- Remaining chapter targets — unmatched / not yet verified.

Evidence for #565: Podwave timestamped transcript `https://pod.wave.co/podcast/the-basement-yard/565-are-we-ready-for-pie`; official YouTube `https://www.youtube.com/watch?v=WGN6kLtVYBk`.

### 10 Saying goodbye
- `bye-02` See you. — matched via natural lexical variant `See you guys next time.` from Joe Santagato in The Basement Yard #565, YouTube `WGN6kLtVYBk`, 79:48–79:57.
- Remaining chapter targets — unmatched / not yet verified.

### 11 Dates, time, and weather
No verified production clips yet.

### 12 Making arrangements
No verified production clips yet.

### 13 Talking about the weather
- `weather-02` It's freezing. — natural lexical variant `It's freezing out.` in the opening of The Basement Yard #480, YouTube `NFqQCoEdGA0`, 0:00–0:10.
- Remaining chapter targets — unmatched / not yet verified.

Evidence for #480: Audioscrape timestamped transcript `https://www.audioscrape.com/podcast/the-basement-yard/episode/480---ai-is-officially-coming-for-us`; official YouTube `https://www.youtube.com/watch?v=NFqQCoEdGA0`.
"""
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('- Verified phrase matches: 15', '- Verified phrase matches: 18', 1)
          s = s.replace('- Unique playable source clips: 12', '- Unique playable source clips: 15', 1)
          s = s.replace(
              '- Anchor sources in production data: The Basement Yard #339, #351, #446, #477, #483, #494, #498, #559, #567',
              '- Anchor sources in production data: The Basement Yard #339, #351, #446, #477, #480, #483, #494, #498, #559, #565, #567',
              1,
          )
          p.write_text(s)
          PY
          git config user.name 'Kavi'
          git config user.email 'thisizkavi@gmail.com'
          git add lib/everyday-english-clips.ts docs/EVERYDAY_ENGLISH_CURATION_STATUS.md
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'Add verified apology goodbye and weather clips'
            git push origin HEAD:curate/everyday-english-09-13
          fi
