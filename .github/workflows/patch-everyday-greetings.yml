name: Patch Everyday English greetings

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'curate/everyday-english-greetings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire verified phrase clips into practice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/page.tsx')
          s = p.read_text()
          anchor = "import { getGoldnrushCollection } from '@/lib/goldnrush-curated'\n"
          extra = "import { getEverydayEnglishCollection } from '@/lib/everyday-english-clips'\n"
          if extra not in s:
              s = s.replace(anchor, anchor + extra, 1)
          old = "() => getCuratedCollection(curatedId) || getGoldnrushCollection(curatedId),"
          new = "() => getCuratedCollection(curatedId) || getGoldnrushCollection(curatedId) || getEverydayEnglishCollection(curatedId),"
          if old not in s and new not in s:
              raise SystemExit('curated resolver anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/english/[chapterId]/page.tsx')
          s = p.read_text()
          s = s.replace("import { ArrowLeft, Search, Star } from 'lucide-react'", "import { ArrowLeft, Play, Search, Star } from 'lucide-react'", 1)
          anchor = "import { EVERYDAY_ENGLISH_ACCENT, getEverydayEnglishChapter } from '@/lib/everyday-english'\n"
          extra = "import { EVERYDAY_ENGLISH_COLLECTIONS, getEverydayEnglishClipMatch } from '@/lib/everyday-english-clips'\n"
          if extra not in s:
              s = s.replace(anchor, anchor + extra, 1)
          old_map = "          {chapter.phrases.map((item, index) => (\n            <Card key={item.id}>"
          new_map = """          {chapter.phrases.map((item, index) => {\n            const clipMatch = getEverydayEnglishClipMatch(item.id)\n            const collection = clipMatch ? EVERYDAY_ENGLISH_COLLECTIONS.find(source => source.id === clipMatch.collectionId) : undefined\n            const segment = clipMatch && collection ? collection.segments.find(entry => entry.id === clipMatch.segmentId) : undefined\n            const practiceUrl = clipMatch && collection ? `/?v=${collection.videoId}&curated=${collection.id}` : null\n\n            return (\n            <Card key={item.id}>"""
          if old_map not in s:
              raise SystemExit('phrase map anchor not found')
          s = s.replace(old_map, new_map, 1)
          old_status = """                  <div className=\"text-right shrink-0 hidden sm:block\">\n                    <p className=\"text-[10px] uppercase tracking-wide text-muted-foreground mb-1\">Clip match</p>\n                    <p className=\"text-xs font-medium\">Not matched yet</p>\n                  </div>"""
          new_status = """                  <div className=\"text-right shrink-0 hidden sm:block\">\n                    <p className=\"text-[10px] uppercase tracking-wide text-muted-foreground mb-1\">Clip match</p>\n                    {practiceUrl && segment && clipMatch ? (\n                      <a href={practiceUrl} className=\"inline-flex items-center gap-1 text-xs font-medium text-primary hover:underline\">\n                        <Play className=\"h-3 w-3 fill-current\" />\n                        Practice {Math.round(segment.end - segment.start)}s clip\n                      </a>\n                    ) : (\n                      <p className=\"text-xs font-medium\">Not matched yet</p>\n                    )}\n                  </div>"""
          if old_status not in s:
              raise SystemExit('clip status anchor not found')
          s = s.replace(old_status, new_status, 1)
          old_end = """            </Card>\n          ))}"""
          new_end = """            </Card>\n            )\n          })}"""
          if old_end not in s:
              raise SystemExit('phrase map end anchor not found')
          s = s.replace(old_end, new_end, 1)
          p.write_text(s)
          PY
          git config user.name 'Kavi'
          git config user.email 'thisizkavi@gmail.com'
          git add app/page.tsx 'app/english/[chapterId]/page.tsx'
          git commit -m 'Wire verified greetings clips into practice'
          git push origin HEAD:${{ github.head_ref }}
