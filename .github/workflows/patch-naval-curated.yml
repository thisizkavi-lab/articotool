name: Patch Naval curated library

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'curate/naval-remaining-complete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire completed Naval sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/curated-library.ts')
          s=p.read_text()
          marker="import type { Segment } from './types'\n"
          block="""import {
            navalSmartFriendsPhilosophy,
            navalSmartFriendsLearningHappiness,
            navalSmartFriendsSavingYourself,
            navalSmartFriendsBuildingJudgement,
            navalDeutschKnowledge1,
            navalDeutschFiles3,
            navalDeutschFiles4,
            navalTimFerriss662,
          } from './naval-curated-extra'
          """
          if "from './naval-curated-extra'" not in s:
              s=s.replace(marker, marker+block)
          replacements={
            'naval-smart-friends-philosophy':'navalSmartFriendsPhilosophy',
            'naval-smart-friends-learning-happiness':'navalSmartFriendsLearningHappiness',
            'naval-smart-friends-saving-yourself':'navalSmartFriendsSavingYourself',
            'naval-smart-friends-building-judgement':'navalSmartFriendsBuildingJudgement',
            'naval-deutsch-knowledge-1':'navalDeutschKnowledge1',
            'naval-deutsch-files-3':'navalDeutschFiles3',
            'naval-deutsch-files-4':'navalDeutschFiles4',
            'naval-tim-ferriss-662':'navalTimFerriss662',
          }
          for source_id,const in replacements.items():
              pattern=r"queuedSource\('"+re.escape(source_id)+r"'[^\n]*\)"
              s,n=re.subn(pattern,const,s,count=1)
              if n != 1 and const not in s:
                  raise SystemExit(f'Could not replace {source_id}: {n}')
          p.write_text(s)
          PY
          git config user.name 'Kavi'
          git config user.email 'thisizkavi@gmail.com'
          if git diff --quiet; then
            echo 'Already patched'
            exit 0
          fi
          git add lib/curated-library.ts
          git commit -m 'Wire remaining Naval sources into curated library'
          git push origin HEAD:${{ github.head_ref }}
